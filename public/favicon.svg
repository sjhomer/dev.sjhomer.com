<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    MU/TH/UR 6000 — site mark.
    The design system says the interface draws with characters only and that
    the block cursor is the brand, so the favicon is exactly that: MOTHER's
    prompt chevron and a lit phosphor cursor, parked on the CRT void, with the
    bloom and a faint scanline pass. Every corner is square (radius-none);
    colours are the `mother` palette tokens from src/styles/tokens.css.
  -->
  <defs>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="scan" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#000" fill-opacity="0.22" />
    </pattern>
  </defs>

  <!-- crt-void ground + lit glass -->
  <rect width="64" height="64" fill="#020a04" />
  <rect x="4" y="4" width="56" height="56" fill="#051a0c" />

  <!-- prompt chevron in phosphor-dim, drawn as the `>` glyph -->
  <path d="M13 19 L26 32 L13 45" fill="none" stroke="#2fb35a" stroke-width="7"
        stroke-linecap="square" stroke-linejoin="miter" />

  <!-- the cursor: a phosphor block, bloomed -->
  <rect x="33" y="19" width="18" height="26" fill="#4dff88" filter="url(#bloom)" />
  <rect x="33" y="19" width="18" height="26" fill="#4dff88" />

  <!-- scanlines over the glass, then the bezel hairline in phosphor-faint -->
  <rect x="4" y="4" width="56" height="56" fill="url(#scan)" />
  <rect x="4.5" y="4.5" width="55" height="55" fill="none" stroke="#124d26" stroke-width="1" />
</svg>
